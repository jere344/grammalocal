name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --workspace

      - name: Build release tarball
        run: bash packaging/package.sh

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          tag="${GITHUB_REF_NAME}"
          # Release notes are this version's section of CHANGELOG.md.
          awk -v v="${tag#v}" '
            /^## \[/ { on = index($0, "## [" v "]") == 1; next }
            on' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "no CHANGELOG.md section for $tag" >&2; exit 1; }
          gh release create "$tag" dist/*.tar.gz dist/*.sha256 install.sh \
            --title "Grammalocal $tag" \
            --notes-file notes.md \
            --verify-tag
