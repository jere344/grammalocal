name: Feature request
description: Suggest an improvement or a new capability
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What are you trying to do, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How you imagine it working. Alternatives you considered are welcome too.
    validations:
      required: true
  - type: dropdown
    id: language
    attributes:
      label: Language concerned
      options:
        - French
        - English
        - Both
        - Not applicable
    validations:
      required: true
