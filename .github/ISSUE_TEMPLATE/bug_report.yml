name: Bug report
description: Report something that does not work as documented
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. For security problems, please use the private reporting described in SECURITY.md instead.
  - type: input
    id: version
    attributes:
      label: Grammalocal version
      description: Output of `grammalocal --version`
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system and desktop
      placeholder: "Ubuntu 24.04, GNOME 46, Wayland"
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Daemon (grammalocald)
        - Command line (grammalocal)
        - Popup (grammalocal-popup)
        - Installer (install.sh)
        - Other
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `grammalocal check --lang fr "..."`
        2. ...
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Output of `journalctl --user -u grammalocald` or `grammalocal status`. Remove any token before pasting.
      render: text
