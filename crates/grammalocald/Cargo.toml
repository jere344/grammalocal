[package]
name = "grammalocald"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description.workspace = true

[lib]
name = "grammalocald"
path = "src/lib.rs"

[[bin]]
name = "grammalocald"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = "0.8"
harper-core = "2"
hex = "0.4"
lru = "0.16"
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "process", "io-util", "net", "signal", "time", "sync"] }
toml = "0.9"
whatlang = "0.18.0"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
